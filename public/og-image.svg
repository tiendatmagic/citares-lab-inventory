<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="og-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00220e"/>
      <stop offset="40%" stop-color="#003817"/>
      <stop offset="100%" stop-color="#001809"/>
    </linearGradient>
    <radialGradient id="og-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#008234" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#00441b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00220e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="og-card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#004d20" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#002e13" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="og-bottle-glass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#005a24"/>
      <stop offset="30%" stop-color="#00b047"/>
      <stop offset="70%" stop-color="#008234"/>
      <stop offset="100%" stop-color="#003314"/>
    </linearGradient>
    <linearGradient id="og-cap-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="40%" stop-color="#ffffff"/>
      <stop offset="80%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#og-bg-grad)"/>

  <!-- Subtle Grid Pattern -->
  <g stroke="#008234" stroke-width="1" stroke-opacity="0.12">
    <line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="150" y1="0" x2="150" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="450" y1="0" x2="450" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="750" y1="0" x2="750" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1050" y1="0" x2="1050" y2="630"/>
  </g>

  <!-- Ambient Light Circle -->
  <circle cx="210" cy="315" r="320" fill="url(#og-glow)"/>

  <!-- Large Heineken Bottle Artwork Left -->
  <g transform="translate(140, 70)">
    <!-- Vòng tròn hào quang phía sau chai bia -->
    <circle cx="70" cy="245" r="160" fill="#00441b" fill-opacity="0.5" stroke="#ffffff" stroke-width="2" stroke-opacity="0.3"/>

    <!-- Nắp chai bạc -->
    <rect x="52" y="25" width="36" height="24" rx="3" fill="url(#og-cap-grad)" stroke="#475569" stroke-width="1.5"/>

    <!-- Thân chai bia Heineken khổng lồ sắc nét -->
    <path d="M54 49 L86 49 L94 135 C94 165 140 190 144 220 L144 440 C144 465 125 475 70 475 C15 475 -4 465 -4 440 L-4 220 C0 190 46 165 46 135 Z"
          fill="url(#og-bottle-glass)" stroke="#ffffff" stroke-width="2" stroke-opacity="0.4"/>

    <!-- Highlight thủy tinh -->
    <path d="M55 55 L62 55 L60 135 C60 155 18 180 12 215 L12 435 C12 445 16 450 25 450 L18 450 C8 450 6 442 6 430 L6 220 C10 185 52 160 52 135 Z"
          fill="#ffffff" opacity="0.3"/>

    <!-- Nhãn cổ chai -->
    <path d="M52 80 L88 80 L90 110 L50 110 Z" fill="#003d18" stroke="#ffffff" stroke-width="1.5"/>

    <!-- Nhãn chính thân chai -->
    <ellipse cx="70" cy="310" rx="58" ry="64" fill="#003d18" stroke="#ffffff" stroke-width="3"/>
    <ellipse cx="70" cy="310" rx="52" ry="58" fill="none" stroke="#6ee7b7" stroke-width="1.5"/>

    <!-- Dải ruy băng đen nhãn -->
    <rect x="16" y="295" width="108" height="32" rx="6" fill="#0b1710" stroke="#ffffff" stroke-width="2"/>
    <text x="70" y="318" text-anchor="middle" fill="#ffffff" font-size="14" font-family="'Roboto', sans-serif" font-weight="900" letter-spacing="2">
      HEINEKEN
    </text>

    <!-- Ngôi sao đỏ Heineken rực rỡ ở tâm nhãn -->
    <path d="M70 250 L75 266 L91 266 L78 276 L83 292 L70 282 L57 292 L62 276 L49 266 L65 266 Z"
          fill="#d3122a" stroke="#ffffff" stroke-width="1.8"/>
  </g>

  <!-- Brand Headers Right -->
  <g transform="translate(420, 110)">
    <!-- Small Category Pill -->
    <rect x="0" y="0" width="370" height="36" rx="18" fill="#008234" fill-opacity="0.3" stroke="#00a843" stroke-width="1.5"/>
    <text x="20" y="23" font-family="'Roboto', Arial, sans-serif" font-size="13" font-weight="700" fill="#4ade80" letter-spacing="2">
      HEINEKEN VIETNAM BREWERIES • SUPPLY CHAIN
    </text>

    <!-- Main Title -->
    <text x="0" y="90" font-family="'Roboto', Arial, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      HỆ THỐNG QUẢN LÝ KHO BIA
    </text>
    <text x="0" y="142" font-family="'Roboto', Arial, sans-serif" font-size="34" font-weight="700" fill="#22c55e" letter-spacing="-0.2">
      HEINEKEN WAREHOUSE &amp; LOGISTICS
    </text>

    <!-- Subtitle -->
    <text x="0" y="190" font-family="'Roboto', Arial, sans-serif" font-size="18" font-weight="400" fill="#cbd5e1" opacity="0.9">
      Giám sát thời gian thực tồn kho Keg 20L/50L, thùng lon Silver,
    </text>
    <text x="0" y="216" font-family="'Roboto', Arial, sans-serif" font-size="18" font-weight="400" fill="#cbd5e1" opacity="0.9">
      IoT kho mát 4°C - 6°C và điều phối 8 bến bốc dỡ xe tải CommaDesk.
    </text>
  </g>

  <!-- Metric Badges Row Bottom -->
  <g transform="translate(420, 390)">
    <!-- Card 1: Cold Storage -->
    <rect x="0" y="0" width="220" height="120" rx="14" fill="url(#og-card-grad)" stroke="#008234" stroke-width="1.5"/>
    <text x="20" y="32" font-family="'Roboto', Arial, sans-serif" font-size="13" font-weight="600" fill="#86efac">NHIỆT ĐỘ KHO MÁT</text>
    <text x="20" y="75" font-family="'Roboto', Arial, sans-serif" font-size="36" font-weight="900" fill="#ffffff">4.8°C</text>
    <text x="20" y="100" font-family="'Roboto', Arial, sans-serif" font-size="13" font-weight="500" fill="#4ade80">● Tiêu chuẩn tối ưu (4-6°C)</text>

    <!-- Card 2: Keg Stock -->
    <rect x="245" y="0" width="235" height="120" rx="14" fill="url(#og-card-grad)" stroke="#008234" stroke-width="1.5"/>
    <text x="265" y="32" font-family="'Roboto', Arial, sans-serif" font-size="13" font-weight="600" fill="#86efac">TỒN KHO KEG BIA TƯƠI</text>
    <text x="265" y="75" font-family="'Roboto', Arial, sans-serif" font-size="36" font-weight="900" fill="#ffffff">12,850</text>
    <text x="265" y="100" font-family="'Roboto', Arial, sans-serif" font-size="13" font-weight="500" fill="#cbd5e1">Bom Keg 20L &amp; 50L</text>

    <!-- Card 3: Dock Logistics -->
    <rect x="505" y="0" width="220" height="120" rx="14" fill="url(#og-card-grad)" stroke="#008234" stroke-width="1.5"/>
    <text x="525" y="32" font-family="'Roboto', Arial, sans-serif" font-size="13" font-weight="600" fill="#86efac">BẾN BỐC DỠ XE TẢI</text>
    <text x="525" y="75" font-family="'Roboto', Arial, sans-serif" font-size="36" font-weight="900" fill="#ffffff">8 Docks</text>
    <text x="525" y="100" font-family="'Roboto', Arial, sans-serif" font-size="13" font-weight="500" fill="#22c55e">FIFO 100% truy xuất lô</text>
  </g>

  <!-- Bottom Brand Footer Line -->
  <line x1="60" y1="570" x2="1140" y2="570" stroke="#008234" stroke-width="1.2" stroke-opacity="0.4"/>
  <text x="60" y="602" font-family="'Roboto', Arial, sans-serif" font-size="14" font-weight="500" fill="#94a3b8">
    © 2026 HEINEKEN BREWERIES VIETNAM • COMMADESK CUSTOM LOGIN UI PACKAGE V1.0
  </text>
  <text x="1140" y="602" font-family="'Roboto', Arial, sans-serif" font-size="14" font-weight="700" fill="#22c55e" text-anchor="end">
    ENTERPRISE SECURITY &amp; 2FA VERIFIED
  </text>
</svg>
