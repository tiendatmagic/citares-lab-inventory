<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060c1d" />
      <stop offset="45%" stop-color="#0d1b3e" />
      <stop offset="100%" stop-color="#081026" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="blue-glow" cx="25%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#20409a" stop-opacity="0.65" />
      <stop offset="50%" stop-color="#0d1b3e" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#060c1d" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orange-glow" cx="85%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#e17335" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#e17335" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#060c1d" stop-opacity="0" />
    </radialGradient>

    <!-- Linear Gradients for Cards & Badges -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12234f" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0b1736" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>

    <linearGradient id="orange-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e17335" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bg-grad)" />

  <!-- Ambient Light Circles -->
  <circle cx="280" cy="315" r="380" fill="url(#blue-glow)" />
  <circle cx="950" cy="150" r="300" fill="url(#orange-glow)" />

  <!-- Technical Circuit Grid Overlay -->
  <g stroke="#38bdf8" stroke-width="1" stroke-opacity="0.12">
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="0" y1="540" x2="1200" y2="540" />
    <line x1="120" y1="0" x2="120" y2="630" />
    <line x1="240" y1="0" x2="240" y2="630" />
    <line x1="360" y1="0" x2="360" y2="630" />
    <line x1="480" y1="0" x2="480" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="720" y1="0" x2="720" y2="630" />
    <line x1="840" y1="0" x2="840" y2="630" />
    <line x1="960" y1="0" x2="960" y2="630" />
    <line x1="1080" y1="0" x2="1080" y2="630" />
  </g>

  <!-- Left Showcase: CITARES Tech & Education Emblem Card -->
  <g transform="translate(80, 85)">
    <!-- Glassmorphic Card Container -->
    <rect x="0" y="0" width="360" height="460" rx="24" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.3" filter="drop-shadow(0 20px 30px rgba(0,0,0,0.5))" />

    <!-- White Logo Box in Emblem -->
    <rect x="35" y="35" width="290" height="110" rx="16" fill="#ffffff" stroke="#c4d6f5" stroke-width="1.5" />
    <!-- CITARES Logo Text Representation -->
    <text x="180" y="95" text-anchor="middle" font-family="'Roboto', sans-serif" font-weight="900" font-size="34" fill="#20409a" letter-spacing="1">
      CITARES
    </text>
    <text x="180" y="125" text-anchor="middle" font-family="'Roboto', sans-serif" font-weight="700" font-style="italic" font-size="14" fill="#e17335" letter-spacing="0.5">
      On practical learning
    </text>

    <!-- Center Graduation & Robotics Illustration -->
    <g transform="translate(180, 245)">
      <!-- Outer Orbit Ring -->
      <circle cx="0" cy="0" r="70" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 6" stroke-opacity="0.5" />
      <circle cx="0" cy="0" r="54" fill="#20409a" fill-opacity="0.4" stroke="#60a5fa" stroke-width="2" />

      <!-- Graduation Cap Vector -->
      <path d="M-36 -12 L0 -28 L36 -12 L0 4 Z" fill="#38bdf8" />
      <path d="M-22 -4 L-22 14 C-22 24 22 24 22 14 L22 -4" fill="none" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" />
      <path d="M26 -8 L26 18" stroke="#e17335" stroke-width="2.5" stroke-linecap="round" />
      <circle cx="26" cy="20" r="2.5" fill="#e17335" />
    </g>

    <!-- Key Training Pills Inside Left Card -->
    <g transform="translate(35, 350)">
      <rect x="0" y="0" width="290" height="34" rx="8" fill="#081026" stroke="#20409a" stroke-width="1.2" />
      <text x="145" y="22" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="13" font-weight="700" fill="#38bdf8">
        100% THỰC HÀNH PHÒNG LAB SHTP
      </text>

      <rect x="0" y="44" width="290" height="34" rx="8" fill="#081026" stroke="#e17335" stroke-width="1.2" />
      <text x="145" y="66" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="13" font-weight="700" fill="#f97316">
        CHỨNG CHỈ KỸ SƯ DOANH NGHIỆP
      </text>
    </g>
  </g>

  <!-- Right Content Section -->
  <g transform="translate(490, 95)">
    <!-- Top Pill: Organization -->
    <rect x="0" y="0" width="460" height="38" rx="19" fill="#12234f" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6" />
    <circle cx="20" cy="19" r="6" fill="#38bdf8" />
    <text x="36" y="24" font-family="'Roboto', sans-serif" font-size="13" font-weight="800" fill="#c4d6f5" letter-spacing="1.5">
      CITARES • VIỆN ĐÀO TẠO THỰC HÀNH CÔNG NGHỆ CAO
    </text>

    <!-- Main Title -->
    <text x="0" y="90" font-family="'Roboto', sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      NỀN TẢNG ĐÀO TẠO
    </text>
    <text x="0" y="146" font-family="'Roboto', sans-serif" font-size="42" font-weight="900" fill="url(#accent-cyan)" letter-spacing="-0.5">
      KỸ THUẬT THỰC CHIẾN
    </text>

    <!-- Subtitle Description -->
    <text x="0" y="195" font-family="'Roboto', sans-serif" font-size="17" font-weight="400" fill="#cbd5e1">
      Hệ sinh thái đào tạo &amp; phát triển kỹ sư chuyên sâu theo chuẩn doanh nghiệp:
    </text>
    <text x="0" y="222" font-family="'Roboto', sans-serif" font-size="17" font-weight="700" fill="#f8fafc">
      Robotics Công Nghiệp · Tự Động Hóa PLC · Thiết Kế Vi Mạch Bán Dẫn (IC)
    </text>

    <!-- 3 Highlight Feature Badges -->
    <g transform="translate(0, 260)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="195" height="74" rx="14" fill="#0f1f45" stroke="#20409a" stroke-width="1.5" />
      <text x="18" y="28" font-family="'Roboto', sans-serif" font-size="12" font-weight="800" fill="#38bdf8">
        KHÓA HỌC CHUYÊN SÂU
      </text>
      <text x="18" y="52" font-family="'Roboto', sans-serif" font-size="15" font-weight="800" fill="#ffffff">
        18+ Chuyên Đề
      </text>

      <!-- Badge 2 -->
      <rect x="215" y="0" width="195" height="74" rx="14" fill="#0f1f45" stroke="#20409a" stroke-width="1.5" />
      <text x="233" y="28" font-family="'Roboto', sans-serif" font-size="12" font-weight="800" fill="#38bdf8">
        HỌC VIÊN &amp; KỸ SƯ
      </text>
      <text x="233" y="52" font-family="'Roboto', sans-serif" font-size="15" font-weight="800" fill="#ffffff">
        480+ Đang Đào Tạo
      </text>

      <!-- Badge 3 -->
      <rect x="430" y="0" width="195" height="74" rx="14" fill="#0f1f45" stroke="#e17335" stroke-width="1.5" />
      <text x="448" y="28" font-family="'Roboto', sans-serif" font-size="12" font-weight="800" fill="#f97316">
        TỶ LỆ ĐẠT CHUẨN
      </text>
      <text x="448" y="52" font-family="'Roboto', sans-serif" font-size="15" font-weight="800" fill="#ffffff">
        98.5% Tốt Nghiệp
      </text>
    </g>

    <!-- Bottom Partnership Badge -->
    <g transform="translate(0, 375)">
      <line x1="0" y1="0" x2="625" y2="0" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.25" />
      <text x="0" y="28" font-family="'Roboto', sans-serif" font-size="14" font-weight="700" fill="#94a3b8">
        LIÊN MINH HỢP TÁC:
      </text>
      <text x="145" y="28" font-family="'Roboto', sans-serif" font-size="14" font-weight="800" fill="#ffffff">
        IDEA GROUP &amp; PROVINA • KHU CÔNG NGHỆ CAO TP. THỦ ĐỨC
      </text>
      <text x="0" y="52" font-family="'Roboto', sans-serif" font-size="13" font-weight="500" fill="#38bdf8">
        🌐 citares.edu.vn  |  📞 Hotline: 094 531 89 68
      </text>
    </g>
  </g>
</svg>
